@if (isOpen()) {
  <!-- A handle over each name: a dashed ring round its middle, to drag, or to click and write its words -->
  <svg class="handles" #handlesSvg aria-hidden="true">
    @for (n of names(); track n.id) {
      <g class="handle" [class.is-picked]="n.id === picked()" [attr.transform]="'translate(' + n.x + ',' + n.y + ')'" (pointerdown)="down($event, n)">
        <rect x="-22" y="-14" width="44" height="28" rx="14" />
        <circle r="3" />
        <title>{{ n.text }}: drag to move, click to write</title>
      </g>
    }
  </svg>

  <section class="nsc-name-editor" aria-label="Name editor">
    <header class="titlebar">
      <b>Names</b>
      <span class="spacer"></span>
      <button type="button" (click)="reset.emit()" title="Put the names back as the data has them">Reset</button>
      <button type="button" class="primary" (click)="copy()" title="Copy the placed and written names as JSON">{{ copied() ? 'Copied' : 'Copy' }}</button>
      <button type="button" class="close" (click)="isOpen.set(false)" title="Close" aria-label="Close">×</button>
    </header>
    <div class="group">
      @if (pickedName(); as n) {
        <h3>{{ n.id }}</h3>
        <!-- Its words as the map draws them; Enter breaks the line there -->
        <textarea class="text" rows="3" [value]="n.text" (input)="write(n.id, $any($event.target).value)" aria-label="The name's words, one line per line"></textarea>
        <div class="buttons">
          <button type="button" (click)="unwrite(n.id)" [disabled]="texts()[n.id] === undefined" title="Back to the land's own name">Own name</button>
        </div>
      } @else {
        <p class="none">Click a ring to write that name.</p>
      }
    </div>
    <p class="hint">Drag a ring to move its name; click it to write the name, Enter for a new line. Both hold on every moment that shows that land. Copy, and paste the JSON to Claude.</p>
    <textarea class="json" readonly [value]="json()" (focus)="$any($event.target).select()" aria-label="The names' places and words as JSON"></textarea>
  </section>
} @else {
  <button type="button" class="show-button" (click)="isOpen.set(true)" title="Move and write the names on the map">Names</button>
}
