<!-- The moments down a time scale, the line being the panel's left edge: a dot each on it, its years level with
     the dot and its title under them; the triangle outside the line, pointing at the moment shown. Click a dot for its moment; only the
     triangle drags. The ear, top left outside the line, folds it to the years and opens it again. -->
<div class="nsc-time-scale" [class.is-closed]="!open()" [class.is-dragging]="dragging()" role="group" aria-label="Moments in time">
  <button type="button" class="ear" [attr.aria-expanded]="open()" [attr.aria-label]="open() ? 'Fold the time scale' : 'Open the time scale'" (click)="openChange.emit(!open())">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path [attr.d]="open() ? 'M6 3 L11 8 L6 13' : 'M10 3 L5 8 L10 13'" /></svg>
  </button>
  <div class="track" #track>
    @for (s of stops(); track s.moment.id) {
      <button type="button" class="stop" [class.is-active]="s.moment.id === activeId()" [class.is-waiting]="s.moment.id === waiting()?.id" [style.top.%]="s.x * 100"
              [attr.aria-pressed]="s.moment.id === activeId()" [title]="s.moment.title" tabindex="-1" (click)="clickStop(s.moment)">
        <span class="dot"></span>
        <span class="text"><span class="year">{{ s.moment.label }}</span>@if (open()) {<span class="title">{{ s.moment.title }}</span>}</span>
      </button>
    }
    <div class="handle" [style.top.%]="position() * 100" tabindex="0" role="slider" aria-label="Moment" aria-orientation="vertical" [attr.aria-valuemin]="0" [attr.aria-valuemax]="moments().length - 1"
         [attr.aria-valuenow]="activeIndex()" [attr.aria-valuetext]="moments()[activeIndex()]?.label" (keydown)="key($event)"
         (pointerdown)="down($event)" (pointermove)="move($event)" (pointerup)="up()" (pointercancel)="up()"></div>
  </div>
</div>
