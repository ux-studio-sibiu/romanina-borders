<figure class="nsc-region-map">
  <!-- Nothing to draw until the ResizeObserver has measured the host -->
  @if (size().width) {
    <svg #mapSvg [attr.viewBox]="viewBox()" role="img" [attr.aria-label]="label()" [class.is-zooming-in]="zoomingIn()" [class.is-plain]="plain()">
      <defs>
        <clipPath [attr.id]="clipId"><path [attr.d]="frame()" /></clipPath>
        <!-- Lesson 06: the soft zones' fuzzy edge: the zone shrunk first (erode), then blurred wide, so the colour fades in
             over a broad band inside its edge; the veil round it is grown by the same amount (dilate) and blurred the same
             way, so the two meet. The filters' boxes are grown so the blur isn't cut off. -->
        <filter [attr.id]="clipId + '-soft'" x="-20%" y="-20%" width="140%" height="140%">
          <feMorphology operator="erode" radius="16" /><feGaussianBlur stdDeviation="26" />
        </filter>
        <filter [attr.id]="clipId + '-soft-light'" x="-20%" y="-20%" width="140%" height="140%">
          <feMorphology operator="erode" radius="4" /><feGaussianBlur stdDeviation="9" />
        </filter>
        <filter [attr.id]="clipId + '-soft-veil'" x="-20%" y="-20%" width="140%" height="140%">
          <feMorphology operator="dilate" radius="16" /><feGaussianBlur stdDeviation="26" />
        </filter>
        <!-- Lesson 05: each empire's hatch: a tint of its colour and a light diagonal line every 7px, light so it shows over
             the dark satellite picture -->
        @for (e of empires(); track e.id) {
          <pattern [attr.id]="e.pattern" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
            <rect width="7" height="7" [attr.fill]="e.colour" fill-opacity="0.3" />
            <line x1="3.5" y1="0" x2="3.5" y2="7" [attr.stroke]="e.light" stroke-width="1.8" stroke-opacity="0.9" />
          </pattern>
        }
      </defs>


      <!-- Lesson 06: while zooming in from the wide data, the wide picture underneath, so the edges aren't blank on the way -->
      @if (camera()?.underlay && satellite()) {
        @let u = underlayBox();
        <image class="satellite underlay" href="data/satellite-wide.webp" [attr.x]="u.x" [attr.y]="u.y" [attr.width]="u.width" [attr.height]="u.height" preserveAspectRatio="none" />
      }

      <!-- Lesson 01: the geography, inside the map's area only (full bleed: its edges are usually off screen). Fills first, then lines from thinnest to heaviest, so a river
           or a country border is never hidden under a county line. (No graticule: the projection's
           curved grid showed at the picture's edges while zooming, so lesson 06 took it out.) -->
      <g class="geography" [class.has-satellite]="satellite()" [attr.clip-path]="'url(#' + clipId + ')'">
        <!-- Lesson 02: the satellite picture first, under everything. preserveAspectRatio none: its box is the area's
             bounding box, already the picture's own shape. -->
        @if (satellite()) {
          @let s = satelliteBox();
          <image class="satellite" [attr.href]="satelliteHref()" [attr.x]="s.x" [attr.y]="s.y" [attr.width]="s.width" [attr.height]="s.height" preserveAspectRatio="none" />
        }
        <path class="sea" [attr.d]="sea()" />
        <path class="land" [attr.d]="land()" />
        @for (e of empires(); track e.id) { <path class="empire" [attr.d]="e.d" [style.fill]="'url(#' + e.pattern + ')'" /> }
        @for (z of zones(); track z.id) { <path class="zone" [class.is-faint]="z.faint" [class.is-light]="z.light" [attr.d]="z.d" [style.--territory]="z.colour" [attr.filter]="'url(#' + clipId + (z.light ? '-soft-light)' : '-soft)')" /> }
        @for (t of fills(); track t.id) { <path class="territory" [attr.d]="t.d" [style.--territory]="t.colour" /> }
        <path class="unit-borders" [attr.d]="unitBorders()" />
        <!-- Each river twice: a pale halo, then the blue line on it, so it stays readable over dark forest -->
        @for (r of rivers(); track r.id) { <path class="river-halo" [class.is-main]="r.id === 'danube'" [attr.d]="r.d" /> }
        @for (r of rivers(); track r.id) { <path class="river" [class.is-main]="r.id === 'danube'" [attr.d]="r.d" /> }
        <path class="country-borders" [attr.d]="countryBorders()" />
        <path class="coastline" [attr.d]="coastline()" />
        <!-- Lesson 05: everything outside the focus veiled, lines and hatching too; the empires' edges, the state's outline
             and every name stay above it -->
        @if (outside()) { <path class="outside" [attr.d]="outside()" fill-rule="evenodd" [attr.filter]="softFocus() ? 'url(#' + clipId + '-soft-veil)' : null" /> }
        <!-- A border drawn twice: a wide white line, then the black one on it, so it reads over any colour -->
        @for (e of empires(); track e.id) { <path class="empire-outline-halo" [attr.d]="e.d" /> }
        @for (e of empires(); track e.id) { <path class="empire-outline" [attr.d]="e.d" [style.stroke]="e.colour" /> }
        <!-- Lesson 06: lands taken away, dotted, over the veil and under the state's border -->
        @for (l of lost(); track l.id) { <path class="lost-halo" [attr.d]="l.d" /><path class="lost-edge" [attr.d]="l.d" /> }
        @for (t of outlines(); track t.id) { <path class="territory-outline-halo" [attr.d]="t.d" /> }
        @for (t of outlines(); track t.id) { <path class="territory-outline" [attr.d]="t.d" [style.--territory]="t.colour" /> }
        <!-- Lesson 06: arrows: one white shape each, outlined in black, revealed tail to head by a mask: a wide stroke along
             its middle line, drawn on in turn (region-map.ts) -->
        <!-- Lesson 07: or set by a year (the time scale's), arrowsAt -->
        @let at = arrowsAt();
        @for (a of arrowPaths(); track a.id; let i = $index) {
          <mask [attr.id]="clipId + '-arrow-' + i"><path class="arrow-reveal" [attr.d]="a.line" pathLength="1" [style.stroke-dashoffset]="at ? 1 - at.states[i].drawn : null" /></mask>
          <path class="arrow" [attr.d]="a.d" [attr.mask]="'url(#' + clipId + '-arrow-' + i + ')'" [style.opacity]="at ? at.states[i].opacity : null" />
        }
      </g>

      <!-- Lesson 05: the territories' names, over every line (outside the clip: a name near the area's edge isn't cut) -->
      <!-- Lesson 06: places, a dot and a name beside it -->
      @for (p of placePoints(); track p.id) {
        <circle class="place-dot" [attr.cx]="p.x" [attr.cy]="p.y" r="4" />
        <text class="place-label" [attr.x]="p.x + 7" [attr.y]="p.y">{{ p.name }}</text>
      }
      @for (a of arrowPaths(); track a.id; let i = $index) {
        <text class="arrow-label" [attr.x]="a.x" [attr.y]="a.y" [style.opacity]="at ? (at.states[i].drawn > 0.5 ? at.states[i].opacity : 0) : null">{{ a.name }}@if (a.when) {<tspan class="when" [attr.x]="a.x" dy="15">{{ a.when }}</tspan>}</text>
      }
      <!-- Lesson 06: when each people came, large at the top of the map, one at a time with its arrow (region-map.ts) -->
      @for (a of arrowPaths(); track a.id; let i = $index) {
        <text class="arrow-year" [attr.x]="size().width / 2" y="58" [style.opacity]="at ? (i === at.caption ? 1 : 0) : null">{{ a.when ? a.when + ': ' : '' }}{{ a.name }}</text>
      }
      @for (e of empires(); track e.id) {
        <text class="empire-label" [attr.x]="e.x" [attr.y]="e.y" [style.fill]="e.ink">
          @for (line of e.lines; track $index) { <tspan [attr.x]="e.x" [attr.dy]="$index ? '1.2em' : (e.lines.length > 1 ? '-0.6em' : '0')">{{ line }}</tspan> }
        </text>
      }
      @for (l of lost(); track l.id) {
        <text class="lost-label" [attr.x]="l.x" [attr.y]="l.y"><tspan [attr.x]="l.x" dy="-0.2em">{{ l.name }}</tspan><tspan class="lost-note" [attr.x]="l.x" dy="1.3em">{{ l.note }}</tspan></text>
      }
      @for (l of labels(); track l.id) {
        <text class="territory-label" [attr.x]="l.x" [attr.y]="l.y" [style.font-size.px]="l.size" [style.fill]="l.colour">
          @for (line of l.lines; track $index) { <tspan [attr.x]="l.x" [attr.dy]="$index ? '1.05em' : (l.lines.length > 1 ? '-0.1em' : '0.35em')">{{ line }}</tspan> }
        </text>
      }
    </svg>
  }
</figure>
