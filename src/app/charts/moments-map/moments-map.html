<div class="nsc-moments-map" (wheel)="scroll($event)">
  <!-- The veil is left off when neighbours are shown (they are the point of the view), or when the moment asks -->
  <app-region-map [geography]="geography.base()" [territories]="territories()" [focus]="moment().unveiled || neighbours().length || countries().length ? null : zone() ?? state() ?? null" [softFocus]="!!zone()"
                  [arrows]="arrows()" [nameAt]="namePlaces" [nameText]="nameTexts" [arrowYear]="arrowYears() && !arrowOverview() ? arrowYear() : null" [arrowOnly]="arrowOnly()" [places]="places()" [spots]="spots()" [coveredRight]="coveredRight()" [view]="view()" [satellite]="!moment().plain" [plain]="!!moment().plain" label="The lands at the chosen moment" />

  <!-- The opening slide: its cover over a darker veil, the whole map's size, fading in and out (not one of the moments'
       panels, which slide). Before the time scale and the scrollbar, so they stay on top of it, still to be used; the
       cover centred clear of them. -->
  @if (moment().intro) {
    <app-intro-cover [moment]="moment()" [style.padding-right.px]="coveredRight() + 24" animate.enter="is-entering" animate.leave="is-leaving" />
  }

  <!-- The moments down a time scale, at the right, with their titles (folds to the years) -->
  <app-time-scale class="scale" [class.is-closed]="!scaleOpen()" [open]="scaleOpen()" (openChange)="scaleOpen.set($event)"
                  [moments]="timeline" [activeId]="momentId()" (picked)="choose($event)" />

  <!-- At the top left, while a migration is named on the play slider: its picture, fading to the next one's within the
       moment, and under it, at its right, when and who; both pushed out with the details when the moment changes -->
  <app-slide-swap class="people-picture" [item]="moment()" [direction]="direction()">
    <ng-template>
      <app-picture-fade [picture]="arrowPicture()" />
      @if (arrowPicture()) { <p class="people-title">{{ arrowTitle() }}</p> }
    </ng-template>
  </app-slide-swap>

  <!-- At the far right: a scrollbar, one step per moment (and per migration within 271) -->
  <app-step-scrollbar class="scrollbar" label="Moments" [count]="steps.length" [index]="stepIndex()" [labels]="stepLabels" (indexChange)="fromScrollbar($event)" />

  <!-- Along the bottom, clear of the time scale: the moment's details at the left, sliding out and in the way the story
       moves; at the right, for a moment with peoples passing through, the play slider for their arrows (above the
       details when the row is too narrow for both) -->
  <div class="bottom" [style.right.px]="coveredRight() + 16">
    <app-slide-swap class="caption" [item]="moment()" [direction]="direction()" aria-live="polite">
      <ng-template let-m>@if (!m.intro) {<app-moment-caption [moment]="m" [open]="captionOpen()" (openChange)="captionOpen.set($event)"
                                              [showCharacters]="charactersShown()" (showCharactersChange)="charactersShown.set($event)" />}</ng-template>
    </app-slide-swap>
    @if (arrowYears(); as span) {
      <app-play-slider class="player" label="Year" [start]="arrowStart()" [spread]="0.6" [min]="span[0]" [max]="span[1]" [value]="arrowYear()" (valueChange)="setArrowYear($event)" [(playing)]="arrowsPlaying"
                       [marks]="arrowMarks()" [activeMark]="activeMark()" (markPicked)="pickArrow($event)">
        <p class="player-title">{{ arrowTitle() || '…' }}</p>
      </app-play-slider>
    }
  </div>
</div>
