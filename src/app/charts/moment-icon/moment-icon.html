<svg class="nsc-moment-icon" viewBox="0 0 48 48" [attr.role]="label() ? 'img' : null" [attr.aria-label]="label() || null" [attr.aria-hidden]="label() ? null : 'true'">
  @switch (icon()) {
    @case ('wolf-banner') {
      <!-- The Dacian draco: a wolf's head on a pole, a long cloth body streaming behind it -->
      <path class="line" d="M9 6V44" />
      <path class="line" fill="#e07a3f" d="M20 17C28 16 31 24 38 22C42 21 44 24 42 28C38 33 30 25 22 24Z" />
      <path class="line" fill="#9aa1a8" d="M9 12L18 8L21 4L23 10L26 13L22 17L24 20L16 21L9 18Z" />
      <circle class="eye" cx="18" cy="12" r="1.3" />
    }
    @case ('eagle') {
      <!-- The Roman eagle: spread wings, a round head -->
      <path class="line" fill="#c0574a" d="M24 20C17 11 8 12 4 17C10 17 14 20 17 25L24 31L31 25C34 20 38 17 44 17C40 12 31 11 24 20Z" />
      <path class="line" fill="#c0574a" d="M20 30L24 42L28 30Z" />
      <circle class="line" fill="#f2b33d" cx="24" cy="16" r="4.5" />
      <path class="line" fill="#f2b33d" d="M27.5 15.5L31 17L27.5 18.5Z" />
    }
    @case ('horse') {
      <!-- A horse's head and mane: the peoples on the move -->
      <path class="line" fill="#a0522d" d="M14 42C13 33 15 25 21 18L19 8L25 13C32 13 38 19 39 26L35 29L31 25C29 30 30 36 33 42Z" />
      <path class="line" fill="#5b3a29" d="M21 18C19 24 17 30 16 36" />
      <circle class="eye" cx="30" cy="20" r="1.4" />
    }
    @case ('crown') {
      <!-- A gold crown -->
      <path class="line" fill="#f2b33d" d="M8 34L10 15L18 24L24 11L30 24L38 15L40 34Z" />
      <path class="line" fill="#e07a3f" d="M8 34H40V40H8Z" />
      <circle class="line" fill="#c0574a" cx="24" cy="29" r="2.5" />
    }
    @case ('castle') {
      <!-- A castle: two towers and a gate -->
      <path class="line" fill="#d9c7a3" d="M8 42V14H13V18H17V14H22V24H26V14H31V18H35V14H40V42Z" />
      <path class="line" fill="#5b3a29" d="M20 42V35A4 4 0 0 1 28 35V42Z" />
      <path class="line" fill="#5b3a29" d="M13 26H17V31H13ZM31 26H35V31H31Z" />
    }
    @case ('shield') {
      <!-- A shield with a cross: defending the land -->
      <path class="line" fill="#6d8fc7" d="M24 5L39 10V22C39 32 32 39 24 43C16 39 9 32 9 22V10Z" />
      <path class="line" d="M24 9V39M13 20H35" />
    }
    @case ('sword') {
      <!-- A sword, point up -->
      <path class="line" fill="#e6e3dc" d="M24 3L27 8V30H21V8Z" />
      <path class="line" fill="#f2b33d" d="M14 30H34V34H14Z" />
      <path class="line" fill="#8e3b46" d="M22 34H26V42H22Z" />
      <circle class="line" fill="#f2b33d" cx="24" cy="44" r="2.2" />
    }
    @case ('map') {
      <!-- A folded map, a dashed route across it: lands taken -->
      <path class="line" fill="#f2e6c9" d="M6 12L18 8L30 12L42 8V36L30 40L18 36L6 40Z" />
      <path class="line" d="M18 8V36M30 12V40" />
      <path class="route" d="M10 31C15 26 20 30 25 24C29 19 33 22 38 16" />
    }
    @case ('hands') {
      <!-- Two rings becoming one: two countries uniting -->
      <circle class="line" fill="#f2b33d" fill-opacity="0.9" cx="18" cy="24" r="11" />
      <circle class="line" fill="#3d5a99" fill-opacity="0.75" cx="30" cy="24" r="11" />
    }
    @case ('flag') {
      <!-- Romania's tricolour on a pole -->
      <path class="line" d="M10 5V44" />
      <path fill="#002b7f" d="M12 8H20V26H12Z" />
      <path fill="#fcd116" d="M20 8H28V26H20Z" />
      <path fill="#ce1126" d="M28 8H36V26H28Z" />
      <path class="line" d="M12 8H36V26H12Z" />
    }
    @case ('storm') {
      <!-- A storm cloud and lightning: the war's losses -->
      <path class="line" fill="#9aa4b1" d="M12 28A8 8 0 0 1 14 12A11 11 0 0 1 34 14A7.5 7.5 0 0 1 36 28Z" />
      <path class="line" fill="#f2b33d" d="M25 26L19 36H24L21 45L32 32H27L30 26Z" />
    }
    @case ('star') {
      <!-- The European Union's blue, and a gold star -->
      <circle class="line" fill="#003399" cx="24" cy="24" r="19" />
      <path fill="#ffcc00" stroke="#5b3a29" stroke-width="1" stroke-linejoin="round" d="M24 11L27.5 19.5L36.5 20L29.5 26L31.8 35L24 30L16.2 35L18.5 26L11.5 20L20.5 19.5Z" />
    }
  }
</svg>
