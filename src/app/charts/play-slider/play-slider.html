<div class="nsc-play-slider" [class.is-playing]="playing()">
  <!-- The title for the value, given by the parent -->
  <div class="heading"><ng-content /></div>
  <div class="row">
    <button type="button" class="play" [attr.aria-label]="playing() ? 'Pause' : 'Play'" (click)="toggle()">
      @if (playing()) {
        <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" /><rect x="7" y="1.5" width="3" height="9" /></svg>
      } @else {
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5 L10.5 6 L3 10.5 Z" /></svg>
      }
    </button>
    <div class="track">
      <input type="range" min="0" [max]="steps" step="1" [value]="place(value()) * steps" [attr.aria-label]="label()" [attr.aria-valuetext]="value().toFixed(0)" (input)="slide($event)" />
      @for (m of marks(); track m.name; let i = $index) {
        <button type="button" class="mark" [class.is-active]="i === activeMark()" [style.left]="'calc(8px + ' + place(m.at) * 100 + '% - ' + place(m.at) * 16 + 'px)'" [attr.aria-label]="m.name" [title]="m.name" (click)="pickMark(i)"></button>
      }
    </div>
  </div>
</div>
